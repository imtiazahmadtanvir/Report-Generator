                          <div class="toolbar-filters">
                            <div class="search-input-box">
                              <lightning-input
                                type="search"
                                label="Search Navigation Tabs"
                                variant="label-hidden"
                                placeholder="Search Tab Label, Name, or Target..."
                                value={appTabSearchTerm}
                                onchange={handleAppTabSearch}
                              ></lightning-input>
                            </div>
                          </div>
                          <div class="toolbar-actions">
                            <span class="slds-badge slds-theme_shade count-badge">
                              Showing {filteredAppTabs.length} of {appDetailTabsCount} Navigation Tabs
                            </span>
                          </div>
                        </div>

                        <div class="styled-table-container">
                          <table class="custom-data-table">
                            <thead>
                              <tr>
                                <th style="width: 70px;">Order</th>
                                <th>Tab Label</th>
                                <th>Tab Name</th>
                                <th>Type</th>
                                <th>Target Object / Component</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template for:each={filteredAppTabs} for:item="tab">
                                <tr key={tab.id}>
                                  <td data-label="Order">
                                    <span class="slds-badge slds-theme_shade">{tab.sortOrder}</span>
                                  </td>
                                  <td data-label="Tab Label">
                                    <strong>{tab.tabLabel}</strong>
                                  </td>
                                  <td data-label="Tab Name">
                                    <code>{tab.tabName}</code>
                                  </td>
                                  <td data-label="Type">
                                    <span class={tab.typeBadgeClass}>
                                      {tab.typeBadgeLabel}
                                    </span>
                                  </td>
                                  <td data-label="Target">
                                    <template lwc:if={tab.isObjectTab}>
                                      <span class="slds-badge slds-theme_light">
                                        <lightning-icon icon-name="utility:database" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {tab.sobjectLabel} ({tab.sobjectName})
                                      </span>
                                    </template>
                                    <template lwc:else>
                                      <span class="slds-badge slds-theme_shade">
                                        <lightning-icon icon-name="utility:custom_apps" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {tab.sobjectLabel}
                                      </span>
                                    </template>
                                  </td>
                                </tr>
                              </template>
                              <template lwc:if={isFilteredTabsEmpty}>
                                <tr>
                                  <td colspan="5" class="empty-state-cell">
                                    No navigation tabs matched your search.
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </template>

                    <!-- SUB-TAB CONTENT 2: OBJECTS -->
                    <template lwc:if={isAppObjectsSubTab}>
                      <div class="slds-p-around_medium detail-subtab-body">
                        <div class="section-toolbar" style="margin-bottom: 1rem;">
                          <div class="toolbar-filters">
                            <div class="search-input-box">
                              <lightning-input
                                type="search"
                                label="Search Objects"
                                variant="label-hidden"
                                placeholder="Search Object Label or API Name..."
                                value={appObjectSearchTerm}
                                onchange={handleAppObjectSearch}
                              ></lightning-input>
                            </div>
                          </div>
                          <div class="toolbar-actions">
                            <span class="slds-badge slds-theme_shade count-badge">
                              Showing {filteredAppObjects.length} of {appDetailObjectsCount} Objects
                            </span>
                          </div>
                        </div>

                        <div class="styled-table-container">
                          <table class="custom-data-table">
                            <thead>
                              <tr>
                                <th>Object Label</th>
                                <th>API Name</th>
                                <th>Type</th>
                                <th>Total Fields</th>
                                <th>Used in Tab(s)</th>
                                <th class="slds-text-align_right">Fields</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template for:each={filteredAppObjects} for:item="obj">
                                <tr key={obj.apiName}>
                                  <td data-label="Object Label">
                                    <strong>{obj.label}</strong>
                                  </td>
                                  <td data-label="API Name">
                                    <code>{obj.apiName}</code>
                                  </td>
                                  <td data-label="Type">
                                    <span class={obj.typeBadgeClass}>
                                      {obj.typeBadgeLabel}
                                    </span>
                                  </td>
                                  <td data-label="Total Fields">
                                    <span class="badge-count">{obj.fieldCount}</span>
                                  </td>
                                  <td data-label="Used in Tab(s)">
                                    <div class="slds-truncate" title={obj.usedInTabsFormatted}>
                                      {obj.usedInTabsFormatted}
                                    </div>
                                  </td>
                                  <td data-label="Fields" class="slds-text-align_right">
                                    <lightning-button
                                      variant="neutral"
                                      label="View Fields"
                                      icon-name="utility:list"
                                      size="small"
                                      data-object={obj.apiName}
                                      data-label={obj.label}
                                      onclick={handleViewObjectFields}
                                    ></lightning-button>
                                  </td>
                                </tr>
                              </template>
                              <template lwc:if={isFilteredObjectsEmpty}>
                                <tr>
                                  <td colspan="6" class="empty-state-cell">
                                    No database objects matched your search.
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </template>

                    <!-- SUB-TAB CONTENT 2: PROFILE ACCESS ASSIGNMENT -->
                    <template lwc:if={isAppProfilesSubTab}>
                      <div class="slds-p-around_medium detail-subtab-body">
                        <!-- TOOLBAR FOR PROFILES -->
                        <div class="section-toolbar" style="margin-bottom: 1rem;">
                          <div class="toolbar-filters">
                            <div class="search-input-box">
                              <lightning-input
                                type="search"
                                label="Search Profiles"
                                variant="label-hidden"
                                placeholder="Search Profile Name or License..."
                                value={appProfileSearchTerm}
                                onchange={handleAppProfileSearch}
                              ></lightning-input>
                            </div>
                            <div class="filter-combo-box">
                              <lightning-combobox
                                label="Filter Access"
                                variant="label-hidden"
                                value={appProfileFilter}
                                options={appProfileFilterOptions}
                                onchange={handleAppProfileFilter}
                              ></lightning-combobox>
                            </div>
                          </div>
                          <div class="toolbar-actions">
                            <span class="slds-badge slds-theme_shade count-badge">
                              Showing {filteredAppProfiles.length} of {selectedAppDetailProfilesCount} Profiles
                            </span>
                          </div>
                        </div>

                        <!-- PROFILES TABLE WITH INSTANT ASSIGN / REMOVE TOGGLE -->
                        <div class="styled-table-container">
                          <table class="custom-data-table">
                            <thead>
                              <tr>
                                <th>Profile Name</th>
                                <th>User License</th>
                                <th>Current Status</th>
                                <th class="slds-text-align_right">Application Access</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template for:each={filteredAppProfiles} for:item="prof">
                                <tr key={prof.profileId}>
                                  <td data-label="Profile Name">
                                    <div class="slds-truncate" title={prof.profileName}>
                                      <strong>{prof.profileName}</strong>
                                    </div>
                                    <template lwc:if={prof.isRestricted}>
                                      <div class="slds-text-body_small slds-m-top_xxx-small" style="color: #b45309;" title={prof.restrictionReason}>
                                        <lightning-icon icon-name="utility:info_alt" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>
                                        {prof.restrictionReason}
                                      </div>
                                    </template>
                                  </td>
                                  <td data-label="User License">
                                    <span class="slds-badge slds-theme_light">{prof.userLicenseName}</span>
                                  </td>
                                  <td data-label="Current Status">
                                    <template lwc:if={prof.hasAccess}>
                                      <span class="slds-badge slds-theme_success">
                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                        Access Granted
                                      </span>
                                    </template>
                                    <template lwc:else>
                                      <template lwc:if={prof.isRestricted}>
                                        <span class="slds-badge slds-theme_warning" title={prof.restrictionReason}>
                                          <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                          License Restricted
                                        </span>
                                      </template>
                                      <template lwc:else>
                                        <span class="slds-badge slds-theme_shade">No Access</span>
                                      </template>
                                    </template>
                                  </td>
                                  <td data-label="Application Access" class="slds-text-align_right">
                                    <template lwc:if={prof.isRestricted}>
                                      <lightning-button-icon
                                        icon-name="utility:lock"
                                        variant="bare"
                                        size="medium"
                                        alternative-text="Restricted by User License"
                                        title={prof.restrictionReason}
                                        disabled
                                      ></lightning-button-icon>
                                    </template>
                                    <template lwc:else>
                                      <lightning-input
                                        type="toggle"
                                        label="App Access"
                                        variant="label-hidden"
                                        checked={prof.hasAccess}
                                        data-profile-id={prof.profileId}
                                        onchange={handleToggleAppProfileAccess}
                                        message-toggle-active="Granted"
                                        message-toggle-inactive="Revoked"
                                      ></lightning-input>
                                    </template>
                                  </td>
                                </tr>
                              </template>
                              <template lwc:if={isFilteredProfilesEmpty}>
                                <tr>
                                  <td colspan="4" class="empty-state-cell">
                                    No profiles matched your filter.
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </template>
          </template>
        </main>
      </div>
    </div>

    <!-- ============================================================== -->
    <!-- CHANGE USER PROFILE                                            -->
    <!-- ============================================================== -->
    <template lwc:if={showProfileModal}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="change-profile-heading"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h1
              id="change-profile-heading"
              class="slds-modal__title slds-hyphenate"
            >
              Change Profile
            </h1>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p class="slds-m-bottom_small">
              Select the new profile for {selectedUser.user.name}. The profile
              sets their baseline object, field, app and system access.
            </p>
            <lightning-combobox
              label="Profile"
              value={newProfileId}
              options={assignableProfileOptions}
              onchange={handleNewProfileChange}
              required
            ></lightning-combobox>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleCloseProfileModal}
            ></lightning-button>
            <lightning-button
              label="Save"
              variant="brand"
              class="slds-m-left_x-small"
              onclick={handleSaveUserProfile}
              disabled={profileSaveDisabled}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <!-- ============================================================== -->
    <!-- CREATE PERMISSION SET MODAL                                    -->
    <!-- ============================================================== -->
    <template lwc:if={showCreatePsModal}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="create-ps-heading"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h1 id="create-ps-heading" class="slds-modal__title slds-hyphenate">
              New Permission Set
            </h1>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p
              class="slds-m-bottom_small slds-text-body_small slds-text-color_weak"
            >
              Create the permission set, then configure Apex class, flow, object
              and field access and assign users in the editor that opens.
            </p>
            <lightning-input
              label="Label"
              required
              placeholder="e.g. Sales Operations Special Access"
              field-level-help="User-friendly display name for this Permission Set."
              value={newPs.label}
              data-field="label"
              onchange={handleNewPsFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-input
              label="API Name"
              placeholder="e.g. Sales_Operations_Special_Access (auto if blank)"
              field-level-help="Unique internal API name. Letters, numbers, and underscores only. Leave blank to generate automatically from the label."
              value={newPs.apiName}
              data-field="apiName"
              onchange={handleNewPsFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-combobox
              label="License"
              placeholder="Select user license (or leave blank for all licenses)"
              field-level-help="Associates this permission set with a specific license type. Leave blank to allow assignment to users with any license."
              value={newPs.licenseId}
              options={licenseOptions}
              data-field="licenseId"
              onchange={handleNewPsFieldChange}
              class="slds-m-bottom_small"
            ></lightning-combobox>
            <lightning-textarea
              label="Description"
              placeholder="Describe the permissions, object access, or feature access granted by this set..."
              field-level-help="Internal summary explaining why this permission set was created and what access it grants."
              value={newPs.description}
              data-field="description"
              onchange={handleNewPsFieldChange}
            ></lightning-textarea>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleCloseCreatePsModal}
            ></lightning-button>
            <lightning-button
              label="Create & Configure"
              variant="brand"
              class="slds-m-left_x-small"
              onclick={handleCreatePermSet}
              disabled={createPsSaveDisabled}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <!-- ============================================================== -->
    <!-- CREATE USER MODAL                                              -->
    <!-- ============================================================== -->
    <template lwc:if={showCreateUserModal}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="create-user-heading"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h1
              id="create-user-heading"
              class="slds-modal__title slds-hyphenate"
            >
              New User
            </h1>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p
              class="slds-m-bottom_small slds-text-body_small slds-text-color_weak"
            >
              Create an active user. Locale, time zone and language default from
              your settings. After creating, their access editor opens.
            </p>
            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-2">
                <lightning-input
                  label="First Name"
                  placeholder="e.g. Jane"
                  field-level-help="User's first name."
                  value={newUser.firstName}
                  data-field="firstName"
                  onchange={handleNewUserFieldChange}
                  class="slds-m-bottom_small"
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2">
                <lightning-input
                  label="Last Name"
                  required
                  placeholder="e.g. Doe"
                  field-level-help="User's last name (required)."
                  value={newUser.lastName}
                  data-field="lastName"
                  onchange={handleNewUserFieldChange}
                  class="slds-m-bottom_small"
                ></lightning-input>
              </div>
            </div>
            <lightning-input
              label="Email"
              type="email"
              required
              placeholder="e.g. jane.doe@company.com"
              field-level-help="Primary email address for system notifications, task alerts, and password resets."
              value={newUser.email}
              data-field="email"
              onchange={handleNewUserFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-input
              label="Username"
              placeholder="e.g. jane.doe@company.com.sandbox (blank to use email)"
              field-level-help="Unique login username in email format across all Salesforce orgs. Leave blank to use the Email address."
              value={newUser.username}
              data-field="username"
              onchange={handleNewUserFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-2">
                <lightning-input
                  label="Alias"
                  placeholder="e.g. jdoe (auto if blank)"
                  field-level-help="Short display identifier (maximum 8 characters). Automatically derived from the name if left blank."
                  max-length="8"
                  value={newUser.alias}
                  data-field="alias"
                  onchange={handleNewUserFieldChange}
                  class="slds-m-bottom_small"
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2">
                <lightning-combobox
                  label="Profile"
                  required
                  placeholder="Select a profile for baseline access"
                  field-level-help="Determines baseline object permissions, page layouts, and administrative capabilities."
                  value={newUser.profileId}
                  options={assignableProfileOptions}
                  data-field="profileId"
                  onchange={handleNewUserFieldChange}
                  class="slds-m-bottom_small"
                ></lightning-combobox>
              </div>
            </div>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleCloseCreateUserModal}
            ></lightning-button>
            <lightning-button
              label="Create & Configure"
              variant="brand"
              class="slds-m-left_x-small"
              onclick={handleCreateUser}
              disabled={createUserSaveDisabled}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <!-- ============================================================== -->
    <!-- CREATE PERMISSION SET GROUP MODAL                              -->
    <!-- ============================================================== -->
    <template lwc:if={showCreatePsgModal}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="create-psg-heading"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h1
              id="create-psg-heading"
              class="slds-modal__title slds-hyphenate"
            >
              New Permission Set Group
            </h1>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p
              class="slds-m-bottom_small slds-text-body_small slds-text-color_weak"
            >
              Create the group, then add component permission sets and assign
              users from the group's detail view.
            </p>
            <lightning-input
              label="Label"
              required
              placeholder="e.g. Sales Representative Bundle"
              field-level-help="User-friendly display name for this Permission Set Group."
              value={newPsg.masterLabel}
              data-field="masterLabel"
              onchange={handleNewPsgFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-input
              label="Developer Name"
              placeholder="e.g. Sales_Representative_Bundle (auto if blank)"
              field-level-help="Unique API identifier for metadata operations. Leave blank to derive automatically from the label."
              value={newPsg.developerName}
              data-field="developerName"
              onchange={handleNewPsgFieldChange}
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-textarea
              label="Description"
              placeholder="Describe which permission sets are bundled together and the target role..."
              field-level-help="Summary explaining the job function or role this permission set group was created to support."
              value={newPsg.description}
              data-field="description"
              onchange={handleNewPsgFieldChange}
            ></lightning-textarea>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleCloseCreatePsgModal}
            ></lightning-button>
            <lightning-button
              label="Create & Configure"
              variant="brand"
              class="slds-m-left_x-small"
              onclick={handleCreatePermSetGroup}
              disabled={createPsgSaveDisabled}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <!-- ============================================================== -->
    <!-- CONFIRMATION MODAL                                             -->
    <!-- ============================================================== -->
    <template lwc:if={showConfirmModal}>
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <div class="modal-header">
            <h2 class="modal-title">{confirmTitle}</h2>
            <lightning-button-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="bare"
              onclick={handleCloseConfirmModal}
            ></lightning-button-icon>
          </div>
          <div class="modal-body">
            <p class="slds-text-body_regular slds-m-bottom_medium">
              {confirmMessage}
            </p>
            <div class="info-alert-banner warning">
              <lightning-icon
                icon-name="utility:warning"
                size="x-small"
                class="alert-icon"
              ></lightning-icon>
              <div>
                This action will immediately modify active Salesforce security
                assignments.
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCloseConfirmModal}
            ></lightning-button>
            <lightning-button
              label="Confirm & Apply Change"
              variant="destructive"
              onclick={handleExecuteConfirmAction}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <!-- ============================================================== -->
    <!-- MULTI-SELECT ASSIGNMENT MODAL                                  -->
    <!-- ============================================================== -->
    <template lwc:if={showAssignModal}>
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <div class="modal-header">
            <h2 class="modal-title">{assignModalTitle}</h2>
            <lightning-button-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="bare"
              onclick={handleCloseAssignModal}
            ></lightning-button-icon>
          </div>
          <div class="modal-body">
            <lightning-input
              type="search"
              label="Search Available"
              variant="label-hidden"
              placeholder="Type to filter list..."
              value={assignSearchTerm}
              onchange={handleAssignModalSearch}
              class="slds-m-bottom_medium"
            ></lightning-input>

            <div class="slds-m-bottom_small slds-text-title_bold">
              Selected: {selectedAssignIds.length} item(s)
            </div>

            <template lwc:if={hasFilteredAssignItems}>
              <template for:each={filteredAssignItems} for:item="item">
                <div
                  key={item.id}
                  class={item.rowClass}
                  data-id={item.id}
                  onclick={handleAssignItemToggle}
                >
                  <div>
                    <div class="slds-text-heading_small">{item.title}</div>
                    <div class="slds-text-body_small slds-text-color_weak">
                      {item.subtitle}
                    </div>
                  </div>
                  <div>
                    <lightning-input
                      type="checkbox"
                      checked={item.selected}
                      label=""
                      variant="label-hidden"
                    ></lightning-input>
                  </div>
                </div>
              </template>
            </template>
            <template lwc:else>
              <div
                class="slds-text-align_center slds-p-around_medium slds-text-color_weak"
              >
                No available items found matching search.
              </div>
            </template>
          </div>
          <div class="modal-footer">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCloseAssignModal}
            ></lightning-button>
            <lightning-button
              label="Assign Selected"
              variant="brand"
              disabled={assignSaveDisabled}
              onclick={handleExecuteAssignAction}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <!-- ============================================================== -->
    <!-- EDIT OBJECT PERMISSIONS MODAL                                  -->
    <!-- ============================================================== -->
    <template lwc:if={showEditObjectModal}>
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <div class="modal-header">
            <h2 class="modal-title">
              Edit Object Permissions: {editObjectData.sobjectLabel}
            </h2>
            <lightning-button-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="bare"
              onclick={handleCloseEditObjectModal}
            ></lightning-button-icon>
          </div>
          <div class="modal-body">
            <p class="slds-text-body_small slds-m-bottom_medium">
              Configure standard CRUD and administrative viewing privileges for
              <code>{editObjectData.sobjectType}</code> on this Custom
              Permission Set.
            </p>

            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsRead"
                  label="Read"
                  checked={editObjectData.permissionsRead}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsCreate"
                  label="Create"
                  checked={editObjectData.permissionsCreate}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsEdit"
                  label="Edit"
                  checked={editObjectData.permissionsEdit}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsDelete"
                  label="Delete"
                  checked={editObjectData.permissionsDelete}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsViewAllRecords"
                  label="View All Records"
                  checked={editObjectData.permissionsViewAllRecords}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsModifyAllRecords"
                  label="Modify All Records"
                  checked={editObjectData.permissionsModifyAllRecords}
                  onchange={handleEditObjectCheckbox}
                ></lightning-input>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCloseEditObjectModal}
            ></lightning-button>
            <lightning-button
              label="Save Object Permissions"
              variant="brand"
              onclick={handleSaveObjectPermissions}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <!-- ============================================================== -->
    <!-- EDIT FIELD PERMISSIONS MODAL                                   -->
    <!-- ============================================================== -->
    <template lwc:if={showEditFieldModal}>
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <div class="modal-header">
            <h2 class="modal-title">
              Edit Field Access: {editFieldData.fieldLabel}
            </h2>
            <lightning-button-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="bare"
              onclick={handleCloseEditFieldModal}
            ></lightning-button-icon>
          </div>
          <div class="modal-body">
            <p class="slds-text-body_small slds-m-bottom_medium">
              Field API Name: <code>{editFieldData.field}</code> on Object
              <code>{editFieldData.sobjectType}</code>.
            </p>

            <div class="slds-grid slds-wrap slds-gutters">
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsRead"
                  label="Read Access"
                  checked={editFieldData.permissionsRead}
                  onchange={handleEditFieldCheckbox}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                  type="checkbox"
                  name="permissionsEdit"
                  label="Edit Access"
                  checked={editFieldData.permissionsEdit}
                  onchange={handleEditFieldCheckbox}
                ></lightning-input>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCloseEditFieldModal}
            ></lightning-button>
            <lightning-button
              label="Save Field Access"
              variant="brand"
              onclick={handleSaveFieldPermissions}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <!-- ============================================================== -->
    <!-- APP OBJECT FIELDS INSPECTOR MODAL                              -->
    <!-- ============================================================== -->
    <template lwc:if={showObjectFieldsModal}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="fields-modal-heading"
        class="slds-modal slds-fade-in-open slds-modal_medium"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h1 id="fields-modal-heading" class="slds-modal__title slds-hyphenate">
              Fields for {activeObjectForFields.label} ({activeObjectForFields.apiName})
            </h1>
            <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
              Inspect all fields and metadata used by this application's object.
            </p>
          </div>
          <div class="slds-modal__content slds-p-around_medium" style="max-height: 500px; overflow-y: auto;">
            <div class="slds-m-bottom_small">
              <lightning-input
                type="search"
                label="Search Fields"
                variant="label-hidden"
                placeholder="Search fields by name, API name, or data type..."
                value={objectFieldSearchTerm}
                onchange={handleObjectFieldSearch}
              ></lightning-input>
            </div>
            <template lwc:if={isLoadingObjectFields}>
              <div class="slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Loading fields..." size="small"></lightning-spinner>
              </div>
            </template>
            <template lwc:else>
              <div class="styled-table-container">
                <table class="custom-data-table">
                  <thead>
                    <tr>
                      <th>Field Label</th>
                      <th>API Name</th>
                      <th>Data Type</th>
                      <th>Type</th>
                      <th>Required</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={filteredObjectFields} for:item="fld">
                      <tr key={fld.apiName}>
                        <td data-label="Field Label">
                          <strong>{fld.label}</strong>
                        </td>
                        <td data-label="API Name">
                          <code>{fld.apiName}</code>
                        </td>
                        <td data-label="Data Type">
                          <span class="slds-badge slds-theme_light">{fld.dataType}</span>
                        </td>
                        <td data-label="Type">
                          <span class={fld.typeBadgeClass}>
                            {fld.typeBadgeLabel}
                          </span>
                        </td>
                        <td data-label="Required">
                          <template lwc:if={fld.isRequired}>
                            <span class="slds-badge slds-theme_error">Required</span>
                          </template>
                          <template lwc:else>
                            <span class="slds-text-color_weak">Optional</span>
                          </template>
                        </td>
                      </tr>
                    </template>
                    <template lwc:if={isFilteredObjectFieldsEmpty}>
                      <tr>
                        <td colspan="5" class="empty-state-cell">
                          No fields match your search.
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              variant="neutral"
              label="Close"
              onclick={handleCloseObjectFieldsModal}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
