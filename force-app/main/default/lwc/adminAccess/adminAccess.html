                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ============================================================== -->
        <!-- CONFIRMATION MODAL                                             -->
        <!-- ============================================================== -->
        <template lwc:if={showConfirmModal}>
            <div class="modal-backdrop">
                <div class="modal-dialog">
                    <div class="modal-header">
                        <h2 class="modal-title">{confirmTitle}</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare"
                            onclick={handleCloseConfirmModal}
                        ></lightning-button-icon>
                    </div>
                    <div class="modal-body">
                        <p class="slds-text-body_regular slds-m-bottom_medium">{confirmMessage}</p>
                        <div class="info-alert-banner warning">
                            <lightning-icon icon-name="utility:warning" size="x-small" class="alert-icon"></lightning-icon>
                            <div>This action will immediately modify active Salesforce security assignments.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCloseConfirmModal}
                        ></lightning-button>
                        <lightning-button
                            label="Confirm & Apply Change"
                            variant="destructive"
                            onclick={handleExecuteConfirmAction}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============================================================== -->
        <!-- MULTI-SELECT ASSIGNMENT MODAL                                  -->
        <!-- ============================================================== -->
        <template lwc:if={showAssignModal}>
            <div class="modal-backdrop">
                <div class="modal-dialog">
                    <div class="modal-header">
                        <h2 class="modal-title">{assignModalTitle}</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare"
                            onclick={handleCloseAssignModal}
                        ></lightning-button-icon>
                    </div>
                    <div class="modal-body">
                        <lightning-input
                            type="search"
                            label="Search Available"
                            variant="label-hidden"
                            placeholder="Type to filter list..."
                            value={assignSearchTerm}
                            onchange={handleAssignModalSearch}
                            class="slds-m-bottom_medium"
                        ></lightning-input>

                        <div class="slds-m-bottom_small slds-text-title_bold">
                            Selected: {selectedAssignIds.length} item(s)
                        </div>

                        <template lwc:if={hasFilteredAssignItems}>
                            <template for:each={filteredAssignItems} for:item="item">
                                <div
                                    key={item.id}
                                    class={item.rowClass}
                                    data-id={item.id}
                                    onclick={handleAssignItemToggle}
                                >
                                    <div>
                                        <div class="slds-text-heading_small">{item.title}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">{item.subtitle}</div>
                                    </div>
                                    <div>
                                        <lightning-input
                                            type="checkbox"
                                            checked={item.selected}
                                            label=""
                                            variant="label-hidden"
                                        ></lightning-input>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                                No available items found matching search.
                            </div>
                        </template>
                    </div>
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCloseAssignModal}
                        ></lightning-button>
                        <lightning-button
                            label="Assign Selected"
                            variant="brand"
                            disabled={assignSaveDisabled}
                            onclick={handleExecuteAssignAction}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============================================================== -->
        <!-- EDIT OBJECT PERMISSIONS MODAL                                  -->
        <!-- ============================================================== -->
        <template lwc:if={showEditObjectModal}>
            <div class="modal-backdrop">
                <div class="modal-dialog">
                    <div class="modal-header">
                        <h2 class="modal-title">Edit Object Permissions: {editObjectData.sobjectLabel}</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare"
                            onclick={handleCloseEditObjectModal}
                        ></lightning-button-icon>
                    </div>
                    <div class="modal-body">
                        <p class="slds-text-body_small slds-m-bottom_medium">
                            Configure standard CRUD and administrative viewing privileges for <code>{editObjectData.sobjectType}</code> on this Custom Permission Set.
                        </p>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsRead"
                                    label="Read"
                                    checked={editObjectData.permissionsRead}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsCreate"
                                    label="Create"
                                    checked={editObjectData.permissionsCreate}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsEdit"
                                    label="Edit"
                                    checked={editObjectData.permissionsEdit}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsDelete"
                                    label="Delete"
                                    checked={editObjectData.permissionsDelete}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsViewAllRecords"
                                    label="View All Records"
                                    checked={editObjectData.permissionsViewAllRecords}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsModifyAllRecords"
                                    label="Modify All Records"
                                    checked={editObjectData.permissionsModifyAllRecords}
                                    onchange={handleEditObjectCheckbox}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCloseEditObjectModal}
                        ></lightning-button>
                        <lightning-button
                            label="Save Object Permissions"
                            variant="brand"
                            onclick={handleSaveObjectPermissions}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============================================================== -->
        <!-- EDIT FIELD PERMISSIONS MODAL                                   -->
        <!-- ============================================================== -->
        <template lwc:if={showEditFieldModal}>
            <div class="modal-backdrop">
                <div class="modal-dialog">
                    <div class="modal-header">
                        <h2 class="modal-title">Edit Field Access: {editFieldData.fieldLabel}</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare"
                            onclick={handleCloseEditFieldModal}
                        ></lightning-button-icon>
                    </div>
                    <div class="modal-body">
                        <p class="slds-text-body_small slds-m-bottom_medium">
                            Field API Name: <code>{editFieldData.field}</code> on Object <code>{editFieldData.sobjectType}</code>.
                        </p>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsRead"
                                    label="Read Access"
                                    checked={editFieldData.permissionsRead}
                                    onchange={handleEditFieldCheckbox}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input
                                    type="checkbox"
                                    name="permissionsEdit"
                                    label="Edit Access"
                                    checked={editFieldData.permissionsEdit}
                                    onchange={handleEditFieldCheckbox}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCloseEditFieldModal}
                        ></lightning-button>
                        <lightning-button
                            label="Save Field Access"
                            variant="brand"
                            onclick={handleSaveFieldPermissions}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
