<template>
  <div class="slds-card admin-app-wrapper">
    <!-- SPINNER -->
    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text="Loading Admin Security Data"
        size="medium"
      ></lightning-spinner>
    </template>

    <!-- ============================================================== -->
    <!-- CONSOLE HEADER (title • stats • actions)                       -->
    <!-- ============================================================== -->
    <header class="console-header">
      <div class="ch-title">
        <div class="ch-icon">
          <lightning-icon
            icon-name="standard:portal"
            size="medium"
            alternative-text="Admin Access"
          ></lightning-icon>
        </div>
        <div class="ch-title-text">
          <p class="ch-eyebrow">Security Console</p>
          <h1 class="ch-title-main">Admin Access</h1>
          <p class="ch-meta">
            Signed in as {overview.currentAdminName} &bull;
            {overview.currentAdminProfile}
          </p>
        </div>
      </div>

      <div class="ch-stats">
        <template for:each={headerStats} for:item="stat">
          <button
            key={stat.key}
            class="ch-stat"
            data-tab={stat.tab}
            data-subtab={stat.subTab}
            onclick={handleStatClick}
            title={stat.title}
          >
            <span class="ch-stat-label">{stat.label}</span>
            <span class="ch-stat-number">{stat.value}</span>
            <span class="ch-stat-meta">{stat.meta}</span>
          </button>
        </template>
      </div>

      <div class="ch-actions">
        <lightning-button
          label="Setup"
          icon-name="utility:setup"
          onclick={handleOpenSetupHome}
        ></lightning-button>
      </div>
    </header>

    <!-- ============================================================== -->
    <!-- MAIN NAVIGATION TABSET                                         -->
    <!-- ============================================================== -->
    <div class="admin-content-area">
      <div class="slds-grid slds-wrap admin-layout">
        <!-- SIDEBAR NAVIGATION (tablet / desktop) -->
        <aside
          class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_2-of-12 slds-show_medium admin-sidebar"
        >
          <lightning-vertical-navigation
            selected-item={activeTab}
            onselect={handleTabChange}
            shaded
          >
            <lightning-vertical-navigation-section label="Security Console">
              <template for:each={navItems} for:item="item">
                <lightning-vertical-navigation-item-icon
                  key={item.name}
                  label={item.label}
                  name={item.name}
                  icon-name={item.icon}
                ></lightning-vertical-navigation-item-icon>
              </template>
            </lightning-vertical-navigation-section>
          </lightning-vertical-navigation>
        </aside>

        <!-- COMPACT NAVIGATION (mobile) -->
        <div
          class="slds-col slds-size_1-of-1 slds-hide_medium slds-p-bottom_small"
        >
          <lightning-combobox
            label="Section"
            value={activeTab}
            options={navItems}
            onchange={handleTabChange}
          ></lightning-combobox>
        </div>

        <!-- SECTION CONTENT -->
        <main
          class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12 slds-large-size_10-of-12 admin-main"
        >
          <!-- ---------------------------------------------------------- -->
          <!-- TAB 1: USER & PROFILE (TOGGLE: PROFILE / USER)               -->
          <!-- ---------------------------------------------------------- -->
          <template lwc:if={isUserAndProfileTab}>
            <!-- SUB-NAVIGATION TOGGLE BAR (Always Visible at the Top) -->
            <div class="user-profile-subnav-container">
              <div
                class="user-profile-toggle-group"
                role="tablist"
                aria-label="User and Profile Views"
              >
                <button
                  type="button"
                  class={profileSubTabClass}
                  data-subtab="profile"
                  onclick={handleSubTabToggle}
                  role="tab"
                  aria-selected={isProfileSubActive}
                  title="Switch to Profiles View"
                >
                  <lightning-icon
                    icon-name="utility:identity"
                    size="x-small"
                    variant={profileIconVariant}
                    class="toggle-icon"
                  ></lightning-icon>
                  <span class="toggle-text">Profile</span>
                  <span class={profileCountBadgeClass}
                    >{overview.totalProfiles}</span
                  >
                </button>
                <button
                  type="button"
                  class={userSubTabClass}
                  data-subtab="user"
                  onclick={handleSubTabToggle}
                  role="tab"
                  aria-selected={isUserSubActive}
                  title="Switch to Users View"
                >
                  <lightning-icon
                    icon-name="utility:user"
                    size="x-small"
                    variant={userIconVariant}
                    class="toggle-icon"
                  ></lightning-icon>
                  <span class="toggle-text">User</span>
                  <span class={userCountBadgeClass}
                    >{overview.totalUsers}</span
                  >
                </button>
              </div>
            </div>

            <!-- SUB-VIEW 1: PROFILES (DEFAULT) -->
            <template lwc:if={isProfileSubActive}>
              <template lwc:if={selectedProfile}>
                <!-- PROFILE DETAIL VIEW -->
                <div
                  class="slds-page-header slds-page-header_record-home detail-header"
                >
                  <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                      <div class="slds-media">
                        <div class="slds-media__figure">
                          <lightning-icon
                            icon-name="standard:customers"
                            size="medium"
                            alternative-text="Profile"
                          ></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                          <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                              <h1>
                                <span>Profile</span>
                                <span
                                  class="slds-page-header__title slds-truncate"
                                  title={selectedProfile.profile.name}
                                  >{selectedProfile.profile.name}</span
                                >
                              </h1>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="slds-page-header__col-actions">
                      <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                          <lightning-button
                            label="View in Setup"
                            icon-name="utility:new_window"
                            onclick={handleOpenProfileSetup}
                          ></lightning-button>
                        </div>
                        <div class="slds-page-header__control">
                          <lightning-button
                            label="Back to Profiles"
                            icon-name="utility:back"
                            onclick={handleBackToProfiles}
                          ></lightning-button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="slds-page-header__row slds-page-header__row_gutters"
                  >
                    <div class="slds-page-header__col-details">
                      <ul class="slds-page-header__detail-row detail-fields">
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="User License"
                          >
                            User License
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedProfile.profile.userLicenseName}
                          >
                            {selectedProfile.profile.userLicenseName}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="User Type"
                          >
                            User Type
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedProfile.profile.userType}
                          >
                            {selectedProfile.profile.userType}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="Users"
                          >
                            Users
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedProfile.profile.userCount}
                          >
                            {selectedProfile.profile.userCount}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="Created"
                          >
                            Created
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedProfile.profile.createdDateFormatted}
                          >
                            {selectedProfile.profile.createdDateFormatted}
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>

                <c-admin-access-editor
                  target-type="Profile"
                  target-id={selectedProfile.profile.id}
                  onopenuser={handleEditorOpenUser}
                  onaccesschange={handleEditorAccessChange}
                ></c-admin-access-editor>
              </template>

              <template lwc:else>
                <!-- PROFILES LIST VIEW -->
                <div class="section-toolbar">
                  <div class="toolbar-filters">
                    <div class="search-input-box">
                      <lightning-input
                        type="search"
                        label="Search Profiles"
                        variant="label-hidden"
                        placeholder="Search Profiles by Name..."
                        value={profileSearchTerm}
                        onchange={handleProfileSearch}
                      ></lightning-input>
                    </div>
                    <div class="filter-combo-box">
                      <lightning-combobox
                        label="Profile Type Filter"
                        variant="label-hidden"
                        value={profileTypeFilter}
                        options={profileTypeOptions}
                        onchange={handleProfileTypeFilterChange}
                      ></lightning-combobox>
                    </div>
                    <div class="filter-combo-box">
                      <lightning-combobox
                        label="License Filter"
                        variant="label-hidden"
                        value={profileLicenseFilter}
                        options={profileLicenseOptions}
                        onchange={handleProfileLicenseFilterChange}
                      ></lightning-combobox>
                    </div>
                  </div>
                  <div class="toolbar-actions">
                    <span class="slds-text-body_small slds-text-color_weak">
                      Showing {profilesList.length} Profile(s)
                    </span>
                  </div>
                </div>

                <div class="styled-table-container">
                  <table class="custom-data-table resp-list">
                    <thead>
                      <tr>
                        <th>Profile Name</th>
                        <th>Type</th>
                        <th>User License</th>
                        <th>User Type</th>
                        <th class="slds-text-align_center">Associated Users</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template for:each={profilesList} for:item="p">
                        <tr key={p.id}>
                          <td data-label="Profile Name">
                            <button
                              class="link-name"
                              data-id={p.id}
                              onclick={handleViewProfileDetail}
                              title="Manage access"
                            >
                              {p.name}
                            </button>
                          </td>
                          <td data-label="Type">
                            <span class={p.typeClass}>{p.typeLabel}</span>
                          </td>
                          <td data-label="User License">{p.userLicenseName}</td>
                          <td data-label="User Type">{p.userType}</td>
                          <td data-label="Users" class="slds-text-align_center">
                            <span class="badge-count">{p.userCount}</span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </template>

            <!-- SUB-VIEW 2: USERS -->
            <template lwc:if={isUserSubActive}>
              <template lwc:if={selectedUser}>
                <!-- USER DETAIL VIEW -->
                <div
                  class="slds-page-header slds-page-header_record-home detail-header"
                >
                  <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                      <div class="slds-media">
                        <div class="slds-media__figure">
                          <lightning-icon
                            icon-name="standard:user"
                            size="medium"
                            alternative-text="User"
                          ></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                          <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                              <h1>
                                <span>User</span>
                                <span
                                  class="slds-page-header__title slds-truncate"
                                  title={selectedUser.user.name}
                                  >{selectedUser.user.name}</span
                                >
                              </h1>
                            </div>
                            <div class="slds-page-header__name-switcher">
                              <span class={selectedUserBadgeClass}
                                >{selectedUser.user.statusBadge}</span
                              >
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="slds-page-header__col-actions">
                      <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                          <lightning-button-group>
                            <lightning-button
                              label="Change Profile"
                              icon-name="utility:change_owner"
                              onclick={handleOpenProfileModal}
                            ></lightning-button>
                            <lightning-button
                              label={toggleUserBtnLabel}
                              icon-name={toggleUserBtnIcon}
                              onclick={handlePromptToggleUserStatus}
                            ></lightning-button>
                            <lightning-button
                              label="View in Setup"
                              icon-name="utility:new_window"
                              onclick={handleOpenUserSetup}
                            ></lightning-button>
                          </lightning-button-group>
                        </div>
                        <div class="slds-page-header__control">
                          <lightning-button
                            label="Back to Users"
                            icon-name="utility:back"
                            onclick={handleBackToUsers}
                          ></lightning-button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="slds-page-header__row slds-page-header__row_gutters"
                  >
                    <div class="slds-page-header__col-details">
                      <ul class="slds-page-header__detail-row detail-fields">
                        <li class="slds-page-header__detail-block">
                          <div class="slds-text-title slds-truncate">
                            Username
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedUser.user.username}
                          >
                            {selectedUser.user.username}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div class="slds-text-title slds-truncate">Email</div>
                          <div
                            class="slds-truncate"
                            title={selectedUser.user.email}
                          >
                            {selectedUser.user.email}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div class="slds-text-title slds-truncate">
                            Profile
                          </div>
                          <button
                            class="slds-button slds-truncate"
                            onclick={handleOpenUserProfile}
                            title={selectedUser.user.profileName}
                          >
                            {selectedUser.user.profileName}
                          </button>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="Role"
                          >
                            Role
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedUser.user.roleName}
                          >
                            {selectedUser.user.roleName}
                          </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                          <div
                            class="slds-text-title slds-truncate"
                            title="Last Login"
                          >
                            Last Login
                          </div>
                          <div
                            class="slds-truncate"
                            title={selectedUser.user.lastLoginFormatted}
                          >
                            {selectedUser.user.lastLoginFormatted}
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>

                <c-admin-access-editor
                  target-type="User"
                  target-id={selectedUser.user.userId}
                  onaccesschange={handleEditorAccessChange}
                ></c-admin-access-editor>
              </template>

              <template lwc:else>
                <!-- USERS LIST VIEW -->
                <div class="section-toolbar">
                  <div class="toolbar-filters">
                    <div class="search-input-box">
                      <lightning-input
                        type="search"
                        label="Search Users"
                        variant="label-hidden"
                        placeholder="Search by Name, Username, or Email..."
                        value={userSearchTerm}
                        onchange={handleUserSearch}
                      ></lightning-input>
                    </div>
                    <div class="filter-combo-box">
                      <lightning-combobox
                        label="Filter Profile"
                        variant="label-hidden"
                        value={userProfileFilter}
                        options={profileOptions}
                        placeholder="Select Profile"
                        onchange={handleUserProfileFilterChange}
                      ></lightning-combobox>
                    </div>
                    <div class="filter-combo-box">
                      <lightning-combobox
                        label="Status"
                        variant="label-hidden"
                        value={userStatusFilter}
                        options={statusOptions}
                        onchange={handleUserStatusFilterChange}
                      ></lightning-combobox>
                    </div>
                    <div class="filter-combo-box filter-combo-box_sm">
                      <lightning-combobox
                        label="Page Size"
                        variant="label-hidden"
                        value={userPageSize}
                        options={userPageSizeOptions}
                        onchange={handleUserPageSizeChange}
                      ></lightning-combobox>
                    </div>
                  </div>
                  <div class="toolbar-actions">
                    <span
                      class="slds-text-body_small slds-text-color_weak slds-m-right_small"
                    >
                      Showing {usersView.showing} of {usersView.total} User(s)
                    </span>
                    <lightning-button
                      label="New User"
                      icon-name="utility:add"
                      variant="brand"
                      onclick={handleNewUserClick}
                    ></lightning-button>
                  </div>
                </div>

                <div class="styled-table-container">
                  <table class="custom-data-table resp-list">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Profile</th>
                        <th>Role</th>
                        <th class="slds-text-align_center">Status</th>
                        <th class="slds-text-align_center">Perm Sets</th>
                        <th class="slds-text-align_center">Groups</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template for:each={usersView.rows} for:item="u">
                        <tr key={u.userId}>
                          <td data-label="Name">
                            <button
                              class="link-name"
                              data-id={u.userId}
                              onclick={handleViewUserDetail}
                              title="Manage access"
                            >
                              {u.name}
                            </button>
                          </td>
                          <td data-label="Username">
                            <code class="cell-clip" title={u.username}
                              >{u.username}</code
                            >
                          </td>
                          <td data-label="Email">
                            <span class="cell-clip" title={u.email}
                              >{u.email}</span
                            >
                          </td>
                          <td data-label="Profile">
                            <span class="slds-badge slds-theme_shade"
                              >{u.profileName}</span
                            >
                          </td>
                          <td data-label="Role">{u.roleName}</td>
                          <td
                            data-label="Status"
                            class="slds-text-align_center"
                          >
                            <span class={u.statusClass}> {u.statusBadge} </span>
                          </td>
                          <td
                            data-label="Perm Sets"
                            class="slds-text-align_center"
                          >
                            <span class="badge-count">{u.permSetCount}</span>
                          </td>
                          <td
                            data-label="Groups"
                            class="slds-text-align_center"
                          >
                            <span class="badge-count"
                              >{u.permSetGroupCount}</span
                            >
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>

                <template lwc:if={usersView.showPagination}>
                  <div class="pagination-bar">
                    <span class="pagination-info"
                      >Showing {usersView.showing} of {usersView.total}</span
                    >
                    <div class="pagination-controls">
                      <button
                        class="page-nav"
                        data-list="users"
                        data-dir="prev"
                        disabled={usersView.prevDisabled}
                        onclick={handlePageChange}
                        title="Previous"
                      >
                        ‹
                      </button>
                      <template for:each={usersView.items} for:item="pi">
                        <template lwc:if={pi.isEllipsis}>
                          <span key={pi.key} class="page-ellipsis"
                            >{pi.label}</span
                          >
                        </template>
                        <template lwc:else>
                          <button
                            key={pi.key}
                            class={pi.cssClass}
                            data-list="users"
                            data-page={pi.page}
                            onclick={handlePageChange}
                          >
                            {pi.label}
                          </button>
                        </template>
                      </template>
                      <button
                        class="page-nav"
                        data-list="users"
                        data-dir="next"
                        disabled={usersView.nextDisabled}
                        onclick={handlePageChange}
                        title="Next"
                      >
                        ›
                      </button>
                    </div>
                  </div>
                </template>
              </template>
            </template>
          </template>

          <!-- ---------------------------------------------------------- -->
          <!-- TAB 2: PERMISSION SETS                                     -->
          <!-- ---------------------------------------------------------- -->
          <template lwc:if={isPermSetsTab}>
            <template lwc:if={isEditingPermSet}>
              <!-- FULL ACCESS EDITOR FOR A (NEW) PERMISSION SET -->
              <div class="detail-hero-banner">
                <div class="hero-identity">
                  <div class="hero-avatar">
                    <lightning-icon
                      icon-name="standard:user_role"
                      size="medium"
                      variant="inverse"
                    ></lightning-icon>
                  </div>
                  <div class="hero-title-block">
                    <div class="hero-main-title">
                      <span>{editingPermSetLabel}</span>
                      <span class="badge-editable">Editing access</span>
                    </div>
                    <div class="hero-subtitle">
                      <span
                        >Grant object, field, Apex class, flow and app access,
                        then assign users on the Assigned Users tab.</span
                      >
                    </div>
                  </div>
                </div>
                <div class="hero-actions">
                  <lightning-button
                    label="← Back to Permission Sets"
                    icon-name="utility:back"
                    variant="neutral"
                    onclick={handleClosePermSetEditor}
                  ></lightning-button>
                </div>
              </div>

              <c-admin-access-editor
                target-type="PermissionSet"
                target-id={editingPermSetId}
                initial-tab={editingPermSetInitialTab}
                onaccesschange={handleEditorAccessChange}
                onopenuser={handleEditorOpenUser}
              ></c-admin-access-editor>
            </template>

            <template lwc:else>
              <template lwc:if={selectedPermSet}>
                <!-- PERMISSION SET DETAIL VIEW -->
                <div class="detail-hero-banner">
                  <div class="hero-identity">
                    <div class="hero-avatar">
                      <lightning-icon
                        icon-name="standard:user_role"
                        size="medium"
                        variant="inverse"
                      ></lightning-icon>
                    </div>
                    <div class="hero-title-block">
                      <div class="hero-main-title">
                        <span>{selectedPermSet.permissionSet.label}</span>
                        <span class={selectedPermSetTypeClass}>
                          {selectedPermSet.permissionSet.typeBadge}
                        </span>
                        <span class={selectedPermSetEditableClass}>
                          {selectedPermSetEditableLabel}
                        </span>
                      </div>
                      <div class="hero-subtitle">
                        <span
                          ><strong>API Name:</strong>
                          <code
                            >{selectedPermSet.permissionSet.name}</code
                          ></span
                        >
                        <span>•</span>
                        <span
                          ><strong>License:</strong>
                          {selectedPermSet.permissionSet.licenseName}</span
                        >
                        <span>•</span>
                        <span
                          ><strong>Assigned Users:</strong>
                          {selectedPermSet.permissionSet.userCount}</span
                        >
                      </div>
                    </div>
                  </div>
                  <div class="hero-actions">
                    <lightning-button
                      label="Manage Access (Apex, Flows, Apps...)"
                      icon-name="utility:edit"
                      variant="brand"
                      class="slds-m-right_small"
                      data-id={selectedPermSet.permissionSet.id}
                      data-label={selectedPermSet.permissionSet.label}
                      onclick={handleOpenPermSetEditor}
                    ></lightning-button>
                    <lightning-button
                      label="← Back to Permission Sets"
                      icon-name="utility:back"
                      variant="neutral"
                      onclick={handleBackToPermSets}
                    ></lightning-button>
                  </div>
                </div>

                <!-- PERMISSION SET SUB-TABS -->
                <lightning-tabset
                  variant="scoped"
                  active-tab-value={selectedPermSetSubTab}
                  onselect={handlePermSetSubTabChange}
                >
                  <!-- SUB-TAB: ASSIGNED USERS -->

          <!-- ---------------------------------------------------------- -->
          <!-- TAB 5: OBJECT ACCESS                                       -->

                    <lightning-button

                      onclick={handleObjViewByUser}
                    ></lightning-button>
                    <lightning-button
                      label="Permission Set"
                      icon-name="standard:permission_set"
                      variant={objPermSetBtnVariant}
                      onclick={handleObjViewByPermSet}
                    ></lightning-button>
                  </lightning-button-group>

                <div class="search-input-box">

                    <th class="slds-text-align_center">Edit</th>
                    <th class="slds-text-align_center">Delete</th>
                    <th class="slds-text-align_center">View All</th>
                    <th class="slds-text-align_center">Modify All</th>

                </thead>
                <tbody>
                  <template lwc:if={hasObjPermItems}>
                    <template for:each={objPermView.rows} for:item="op">

                          <strong>{op.sobjectLabel}</strong>
                        </td>
                        <td data-label="API Name">
                          <code>{op.sobjectType}</code>
                        </td>
                        <td data-label="Type">
                          <span class={op.typeClass}>{op.typeBadge}</span>
                        </td>
                        <td data-label="Read" class="slds-text-align_center">
                          <template lwc:if={op.permissionsRead}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td data-label="Create" class="slds-text-align_center">
                          <template lwc:if={op.permissionsCreate}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td data-label="Edit" class="slds-text-align_center">
                          <template lwc:if={op.permissionsEdit}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td data-label="Delete" class="slds-text-align_center">
                          <template lwc:if={op.permissionsDelete}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td
                          data-label="View All"
                          class="slds-text-align_center"
                        >
                          <template lwc:if={op.permissionsViewAllRecords}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td
                          data-label="Modify All"
                          class="slds-text-align_center"
                        >
                          <template lwc:if={op.permissionsModifyAllRecords}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>

                      <td

                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <template lwc:if={objPermView.multiPage}>

                <span class="pagination-info"

                >
                <div class="pagination-controls">
                  <button
                    class="page-nav"
                    data-list="objects"
                    data-dir="prev"
                    disabled={objPermView.prevDisabled}
                    onclick={handlePageChange}
                    title="Previous"
                  >
                    ‹
                  </button>
                  <template for:each={objPermView.items} for:item="pi">
                    <template lwc:if={pi.isEllipsis}>
                      <span key={pi.key} class="page-ellipsis">{pi.label}</span>
                    </template>
                    <template lwc:else>
                      <button
                        key={pi.key}
                        class={pi.cssClass}
                        data-list="objects"
                        data-page={pi.page}
                        onclick={handlePageChange}
                      >
                        {pi.label}
                      </button>
                    </template>
                  </template>
                  <button
                    class="page-nav"
                    data-list="objects"
                    data-dir="next"
                    disabled={objPermView.nextDisabled}
                    onclick={handlePageChange}
                    title="Next"
                  >
                    ›
                  </button>
                </div>
              </div>
            </template>
          </template>

          <!-- ---------------------------------------------------------- -->
          <!-- TAB 6: FIELD-LEVEL SECURITY (FLS)                          -->
          <!-- ---------------------------------------------------------- -->
          <template lwc:if={isFieldsTab}>
            <div class="section-toolbar">
              <div class="toolbar-filters filters-with-labels">
                <div class="filter-combo-box">
                  <lightning-combobox
                    label="Select Object"
                    value={flsSelectedObject}
                    options={objectOptions}
                    onchange={handleFlsObjectChange}
                  ></lightning-combobox>
                </div>
                <div class="filter-group">
                  <label class="slds-form-element__label">View Access By</label>
                  <lightning-button-group>
                    <lightning-button
                      label="Profile"
                      icon-name="standard:profile"
                      variant={flsProfileBtnVariant}
                      onclick={handleFlsViewByProfile}
                    ></lightning-button>
                    <lightning-button
                      label="User"
                      icon-name="standard:user"
                      variant={flsUserBtnVariant}
                      onclick={handleFlsViewByUser}
                    ></lightning-button>
                    <lightning-button
                      label="Permission Set"
                      icon-name="standard:permission_set"
                      variant={flsPermSetBtnVariant}
                      onclick={handleFlsViewByPermSet}
                    ></lightning-button>
                  </lightning-button-group>
                </div>
                <div class="search-input-box">
                  <lightning-combobox
                    label={flsTargetLabel}
                    value={flsSelectedTargetId}
                    options={flsTargetOptions}
                    placeholder={flsTargetPlaceholder}
                    onchange={handleFlsTargetChange}
                  ></lightning-combobox>
                </div>
                <div class="search-input-box">
                  <lightning-input
                    type="search"
                    label="Search Fields"
                    placeholder="Filter fields by name or label..."
                    value={flsSearchTerm}
                    onchange={handleFlsSearch}
                  ></lightning-input>
                </div>
              </div>
            </div>

            <div class="styled-table-container">
              <table class="custom-data-table resp-list">
                <thead>
                  <tr>
                    <th>Field Label</th>
                    <th>API Name</th>
                    <th>Data Type</th>
                    <th>Field Type</th>
                    <th class="slds-text-align_center">Read Access</th>
                    <th class="slds-text-align_center">Edit Access</th>
                  </tr>
                </thead>
                <tbody>
                  <template lwc:if={hasFlsFieldItems}>
                    <template for:each={flsFieldView.rows} for:item="fp">
                      <tr key={fp.field}>
                        <td data-label="Field Label">
                          <strong>{fp.fieldLabel}</strong>
                        </td>
                        <td data-label="API Name"><code>{fp.field}</code></td>
                        <td data-label="Data Type">
                          <span class="slds-badge slds-theme_shade"
                            >{fp.dataType}</span
                          >
                        </td>
                        <td data-label="Field Type">
                          <span class={fp.typeClass}>{fp.typeBadge}</span>
                        </td>
                        <td
                          data-label="Read Access"
                          class="slds-text-align_center"
                        >
                          <template lwc:if={fp.permissionsRead}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                        <td
                          data-label="Edit Access"
                          class="slds-text-align_center"
                        >
                          <template lwc:if={fp.permissionsEdit}
                            ><span class="perm-check-true">✓</span></template
                          >
                          <template lwc:else
                            ><span class="perm-check-false">—</span></template
                          >
                        </td>
                      </tr>
                    </template>
                  </template>
                  <template lwc:else>
                    <tr>
                      <td
                        colspan="6"
                        class="slds-text-align_center slds-p-around_large slds-text-color_weak"

                        No fields found for this object or search query.
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <template lwc:if={flsFieldView.multiPage}>
              <div class="pagination-bar">
                <span class="pagination-info"
                  >Showing {flsFieldView.showing} of {flsFieldView.total}</span
                >
                <div class="pagination-controls">
                  <button
                    class="page-nav"
                    data-list="fls"
                    data-dir="prev"
                    disabled={flsFieldView.prevDisabled}
                    onclick={handlePageChange}
                    title="Previous"
                  >
                    ‹
                  </button>
                  <template for:each={flsFieldView.items} for:item="pi">
                    <template lwc:if={pi.isEllipsis}>
                      <span key={pi.key} class="page-ellipsis">{pi.label}</span>
                    </template>
                    <template lwc:else>
                      <button
                        key={pi.key}
                        class={pi.cssClass}
                        data-list="fls"
                        data-page={pi.page}
                        onclick={handlePageChange}
                      >
                        {pi.label}
                      </button>
                    </template>
                  </template>
                  <button
                    class="page-nav"
                    data-list="fls"
                    data-dir="next"
                    disabled={flsFieldView.nextDisabled}
                    onclick={handlePageChange}
                    title="Next"
                  >
                    ›
                  </button>
                </div>
              </div>
            </template>
          </template>

          <!-- ---------------------------------------------------------- -->
          <!-- TAB 4: APPS (MANAGEMENT & DETAIL)                           -->
          <!-- ---------------------------------------------------------- -->
          <template lwc:if={isAppsTab}>
            <!-- VIEW A: APPS LIST VIEW (WHEN NO APP SELECTED) -->
            <template lwc:if={isAppListView}>
              <div class="section-toolbar">
                <div class="toolbar-filters">
                  <div class="search-input-box">
                    <lightning-input
                      type="search"
                      label="Search Apps"
                      variant="label-hidden"
                      placeholder="Search by App Name, Developer Name, or Description..."
                      value={appSearchTerm}
                      onchange={handleAppSearch}
                    ></lightning-input>
                  </div>
                  <div class="filter-combo-box">
                    <lightning-combobox
                      label="Filter Type"
                      variant="label-hidden"
                      placeholder="Filter Type"
                      value={appTypeFilter}
                      options={appTypeOptions}
                      onchange={handleAppTypeFilter}
                    ></lightning-combobox>
                  </div>
                  <div class="filter-combo-box">
                    <lightning-combobox
                      label="Navigation Type"
                      variant="label-hidden"
                      placeholder="Navigation Type"
                      value={appNavFilter}
                      options={appNavOptions}
                      onchange={handleAppNavFilter}
                    ></lightning-combobox>
                  </div>
                </div>
                <div class="toolbar-actions">
                  <span class="slds-text-body_small slds-text-color_weak slds-m-right_small">
                    Showing {filteredAppsCount} of {totalAppsCount} App(s)
                  </span>
                </div>
              </div>

              <div class="styled-table-container">
                <table class="custom-data-table resp-list">
                  <thead>
                    <tr>
                      <th>Application</th>
                      <th>Developer Name</th>
                      <th>Type</th>
                      <th>Navigation</th>
                      <th class="slds-text-align_center">Profiles with Access</th>
                      <th class="slds-text-align_center">Permission Sets</th>

                    <template for:each={filteredAppsList} for:item="app">
                      <tr key={app.id}>
                        <td data-label="Application">
                          <button
                            class="link-name"
                            data-id={app.id}
                            onclick={handleSelectApp}
                            title="Click to view tabs, objects, and assign profiles"
                          >
                            {app.label}
                          </button>
                          <div class="slds-text-body_small slds-text-color_weak slds-truncate" title={app.description}>
                            {app.description}
                          </div>
                        </td>
                        <td data-label="Developer Name">
                          <code>{app.developerName}</code>
                        </td>
                        <td data-label="Type">
                          <span class={app.typeBadgeClass}>{app.typeBadgeLabel}</span>
                        </td>
                        <td data-label="Navigation">
                          <span class="slds-badge slds-theme_light">{app.navType}</span>
                        </td>
                        <td data-label="Profiles with Access" class="slds-text-align_center">
                          <span class="badge-count">{app.profilesCount}</span>
                        </td>
                        <td data-label="Permission Sets" class="slds-text-align_center">
                          <span class="badge-count">{app.permSetsCount}</span>
                        </td>
                      </tr>
                    </template>
                    <template lwc:if={isFilteredAppsEmpty}>
                      <tr>
                        <td colspan="6" class="empty-state-cell">
                          <div class="slds-text-align_center slds-p-around_large">
                            <lightning-icon icon-name="utility:search" size="medium" class="slds-m-bottom_small"></lightning-icon>
                            <p class="slds-text-heading_small">No applications found</p>
                            <p class="slds-text-color_weak">Try changing your search keyword or filter options.</p>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <!-- VIEW B: APP DETAIL VIEW (WHEN APP SELECTED) -->
            <template lwc:if={isAppDetailView}>
              <div class="slds-page-header slds-page-header_record-home detail-header">
                <div class="slds-page-header__row">
                  <div class="slds-page-header__col-title">
                    <div class="slds-media">
                      <div class="slds-media__figure">
                        <lightning-icon
                          icon-name="standard:apps"
                          size="medium"
                          alternative-text="Application"
                        ></lightning-icon>
                      </div>
                      <div class="slds-media__body">
                        <div class="slds-page-header__name">
                          <div class="slds-page-header__name-title">
                            <h1>
                              <span>Application Overview & Access</span>
                              <span class="slds-page-header__title slds-truncate" title={selectedApp.label}>
                                {selectedApp.label}
                              </span>
                            </h1>
                          </div>
                        </div>
                        <div class="slds-page-header__name-meta slds-m-top_xx-small">
                          <code>{selectedApp.developerName}</code>
                          <span class="slds-m-horizontal_xx-small">•</span>
                          <span class={selectedApp.typeBadgeClass}>{selectedApp.typeBadgeLabel}</span>
                          <span class="slds-m-horizontal_xx-small">•</span>
                          <span>Nav: {selectedApp.navType}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                      <div class="slds-page-header__control">
                        <lightning-button
                          icon-name="utility:back"
                          label="Back to Apps"
                          onclick={handleBackToAppsList}
                        ></lightning-button>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- KEY METRICS BANNER -->
                <template lwc:if={selectedAppDetail}>
                  <div class="detail-kpi-bar slds-m-top_small">
                    <div class="kpi-pill" data-tab="tabs" onclick={handleAppDetailSubTab} style="cursor: pointer;" title="Click to view Navigation Tabs">
                      <lightning-icon icon-name="utility:tabset" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                      <span><strong>{selectedAppDetail.totalTabs}</strong> Included Tabs</span>
                    </div>
                    <div class="kpi-pill" data-tab="objects" onclick={handleAppDetailSubTab} style="cursor: pointer;" title="Click to view Objects">
                      <lightning-icon icon-name="utility:database" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                      <span><strong>{selectedAppDetail.totalObjects}</strong> Objects Exposed</span>
                    </div>
                    <div class="kpi-pill kpi-pill_highlight" data-tab="profiles" onclick={handleAppDetailSubTab} style="cursor: pointer;" title="Click to view Profile Access">
                      <lightning-icon icon-name="utility:user_role" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                      <span><strong>{selectedAppDetail.totalProfilesWithAccess}</strong> Profiles with Direct Access</span>

                  </div>

                  <p class="slds-text-heading_small slds-text-color_weak" style="padding-top:60px;">Loading application tabs, objects, and profile permissions...</p>
                </div>
              </template>
              <template lwc:else>
                <!-- APP DETAIL SUB-TABS -->
                <div class="app-subtabs-container slds-m-top_medium">
                  <div class="slds-tabs_default">
                    <ul class="slds-tabs_default__nav" role="tablist">
                      <li
                        class={appTabsTabClass}
                        title="Navigation items and tabs displayed in this app"
                        role="presentation"
                      >
                        <a
                          class="slds-tabs_default__link"
                          href="javascript:void(0);"
                          role="tab"
                          data-tab="tabs"
                          onclick={handleAppDetailSubTab}
                        >
                          <lightning-icon icon-name="utility:tabset" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                          Navigation Tabs ({appDetailTabsCount})
                        </a>
                      </li>
                      <li
                        class={appObjectsTabClass}
                        title="Database objects used in this app"

                        <a

                      <li

                        <a
                          class="slds-tabs_default__link"
                          href="javascript:void(0);"
                          role="tab"
                          data-tab="profiles"
                          onclick={handleAppDetailSubTab}
                        >
                          <lightning-icon icon-name="utility:user_role" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                          Profile Access ({selectedAppDetailProfilesCount})
                        </a>
                      </li>
                    </ul>
