<template>
    <div class="slds-card admin-app-wrapper">
        <!-- SPINNER -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading Admin Security Data" size="medium"></lightning-spinner>
        </template>

        <!-- ============================================================== -->
        <!-- EXECUTIVE ADMIN CONSOLE HEADER                                 -->
        <!-- ============================================================== -->
        <div class="slds-page-header slds-page-header_record-home console-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:portal" size="medium" alternative-text="Admin Access"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span>Security Console</span>
                                        <span class="slds-page-header__title slds-truncate" title="Admin Access">Admin Access</span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                Signed in as {overview.currentAdminName} &bull; {overview.currentAdminProfile}
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="Refresh" icon-name="utility:refresh" onclick={refreshAll}></lightning-button>
                                <lightning-button label="Setup" icon-name="utility:setup" onclick={handleOpenSetupHome}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row slds-page-header__row_gutters">
                <div class="slds-page-header__col-details">
                    <ul class="slds-page-header__detail-row console-stats">
                        <template for:each={headerStats} for:item="stat">
                            <li key={stat.tab} class="slds-page-header__detail-block">
                                <button class="slds-button stat-button" data-tab={stat.tab} onclick={handleStatClick} title={stat.title}>
                                    <span class="slds-text-title slds-truncate">{stat.label}</span>
                                    <span class="stat-number">{stat.value}</span>
                                    <span class="slds-text-body_small slds-text-color_weak">{stat.meta}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>

        <!-- ============================================================== -->
        <!-- MAIN NAVIGATION TABSET                                         -->
        <!-- ============================================================== -->
        <div class="admin-content-area">
            <div class="slds-grid slds-wrap admin-layout">
                <!-- SIDEBAR NAVIGATION (tablet / desktop) -->
                <aside class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_2-of-12 slds-show_medium admin-sidebar">
                    <lightning-vertical-navigation
                        selected-item={activeTab}
                        onselect={handleTabChange}
                        shaded
                    >
                        <lightning-vertical-navigation-section label="Security Console">
                            <template for:each={navItems} for:item="item">
                                <lightning-vertical-navigation-item-icon
                                    key={item.name}
                                    label={item.label}
                                    name={item.name}
                                    icon-name={item.icon}
                                ></lightning-vertical-navigation-item-icon>
                            </template>
                        </lightning-vertical-navigation-section>
                    </lightning-vertical-navigation>
                </aside>

                <!-- COMPACT NAVIGATION (mobile) -->
                <div class="slds-col slds-size_1-of-1 slds-hide_medium slds-p-bottom_small">
                    <lightning-combobox
                        label="Section"
                        value={activeTab}
                        options={navItems}
                        onchange={handleTabChange}
                    ></lightning-combobox>
                </div>

                <!-- SECTION CONTENT -->
                <main class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12 slds-large-size_10-of-12 admin-main">

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 1: USERS                                               -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isUsersTab}>
                    <template lwc:if={selectedUser}>
                        <!-- USER DETAIL VIEW -->
                        <div class="slds-page-header slds-page-header_record-home detail-header">
                            <div class="slds-page-header__row">
                                <div class="slds-page-header__col-title">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="standard:user" size="medium" alternative-text="User"></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="slds-page-header__name">
                                                <div class="slds-page-header__name-title">
                                                    <h1>
                                                        <span>User</span>
                                                        <span class="slds-page-header__title slds-truncate" title={selectedUser.user.name}>{selectedUser.user.name}</span>
                                                    </h1>
                                                </div>
                                                <div class="slds-page-header__name-switcher">
                                                    <span class={selectedUserBadgeClass}>{selectedUser.user.statusBadge}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-page-header__col-actions">
                                    <div class="slds-page-header__controls">
                                        <div class="slds-page-header__control">
                                            <lightning-button-group>
                                                <lightning-button label="Change Profile" icon-name="utility:change_owner" onclick={handleOpenProfileModal}></lightning-button>
                                                <lightning-button label={toggleUserBtnLabel} icon-name={toggleUserBtnIcon} onclick={handlePromptToggleUserStatus}></lightning-button>
                                                <lightning-button label="View in Setup" icon-name="utility:new_window" onclick={handleOpenUserSetup}></lightning-button>
                                            </lightning-button-group>
                                        </div>
                                        <div class="slds-page-header__control">
                                            <lightning-button label="Back to Users" icon-name="utility:back" onclick={handleBackToUsers}></lightning-button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-page-header__row slds-page-header__row_gutters">
                                <div class="slds-page-header__col-details">
                                    <ul class="slds-page-header__detail-row detail-fields">
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Username</div>
                                            <div class="slds-truncate" title={selectedUser.user.username}>{selectedUser.user.username}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Email</div>
                                            <div class="slds-truncate" title={selectedUser.user.email}>{selectedUser.user.email}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Profile</div>
                                            <button class="slds-button" onclick={handleOpenUserProfile} title="Manage access for this profile">{selectedUser.user.profileName}</button>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Role</div>
                                            <div class="slds-truncate">{selectedUser.user.roleName}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Last Login</div>
                                            <div class="slds-truncate">{selectedUser.user.lastLoginFormatted}</div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <c-admin-access-editor
                            target-type="User"
                            target-id={selectedUser.user.userId}
                            onaccesschange={handleEditorAccessChange}
                        ></c-admin-access-editor>
                    </template>

                    <template lwc:else>
                        <!-- USERS LIST VIEW -->
                        <div class="section-toolbar">
                            <div class="toolbar-filters">
                                <div class="search-input-box">
                                    <lightning-input
                                        type="search"
                                        label="Search Users"
                                        variant="label-hidden"
                                        placeholder="Search by Name, Username, or Email..."
                                        value={userSearchTerm}
                                        onchange={handleUserSearch}
                                    ></lightning-input>
                                </div>
                                <div class="filter-combo-box">
                                    <lightning-combobox
                                        label="Filter Profile"
                                        variant="label-hidden"
                                        value={userProfileFilter}
                                        options={profileOptions}
                                        placeholder="Select Profile"
                                        onchange={handleUserProfileFilterChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="filter-combo-box">
                                    <lightning-combobox
                                        label="Status"
                                        variant="label-hidden"
                                        value={userStatusFilter}
                                        options={statusOptions}
                                        onchange={handleUserStatusFilterChange}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="toolbar-actions">
                                <span class="slds-text-body_small slds-text-color_weak">
                                    Showing {usersList.length} User(s)
                                </span>
                            </div>
                        </div>

                        <div class="styled-table-container">
                            <table class="custom-data-table resp-list">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Profile</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Perm Sets</th>
                                        <th>Groups</th>
                                        <th class="slds-text-align_right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={usersList} for:item="u">
                                        <tr key={u.userId}>
                                            <td data-label="Name"><strong>{u.name}</strong></td>
                                            <td data-label="Username"><code>{u.username}</code></td>
                                            <td data-label="Email">{u.email}</td>
                                            <td data-label="Profile"><span class="slds-badge slds-theme_shade">{u.profileName}</span></td>
                                            <td data-label="Role">{u.roleName}</td>
                                            <td data-label="Status">
                                                <span class={u.statusClass}>
                                                    {u.statusBadge}
                                                </span>
                                            </td>
                                            <td data-label="Perm Sets"><span class="badge-count">{u.permSetCount}</span></td>
                                            <td data-label="Groups"><span class="badge-count">{u.permSetGroupCount}</span></td>
                                            <td data-label="Action" class="slds-text-align_right">
                                                <lightning-button
                                                    label="Manage Access"
                                                    icon-name="utility:edit"
                                                    variant="brand"
                                                    data-id={u.userId}
                                                    onclick={handleViewUserDetail}
                                                ></lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </template>

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 2: PERMISSION SETS                                     -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isPermSetsTab}>
                    <template lwc:if={selectedPermSet}>
                        <!-- PERMISSION SET DETAIL VIEW -->
                        <div class="detail-hero-banner">
                            <div class="hero-identity">
                                <div class="hero-avatar">
                                    <lightning-icon icon-name="standard:user_role" size="medium" variant="inverse"></lightning-icon>
                                </div>
                                <div class="hero-title-block">
                                    <div class="hero-main-title">
                                        <span>{selectedPermSet.permissionSet.label}</span>
                                        <span class={selectedPermSetTypeClass}>
                                            {selectedPermSet.permissionSet.typeBadge}
                                        </span>
                                        <span class={selectedPermSetEditableClass}>
                                            {selectedPermSetEditableLabel}
                                        </span>
                                    </div>
                                    <div class="hero-subtitle">
                                        <span><strong>API Name:</strong> <code>{selectedPermSet.permissionSet.name}</code></span>
                                        <span>•</span>
                                        <span><strong>License:</strong> {selectedPermSet.permissionSet.licenseName}</span>
                                        <span>•</span>
                                        <span><strong>Assigned Users:</strong> {selectedPermSet.permissionSet.userCount}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-actions">
                                <lightning-button
                                    label="← Back to Permission Sets"
                                    icon-name="utility:back"
                                    variant="neutral"
                                    onclick={handleBackToPermSets}
                                ></lightning-button>
                            </div>
                        </div>

                        <!-- PERMISSION SET SUB-TABS -->
                        <lightning-tabset variant="scoped" active-tab-value={selectedPermSetSubTab} onselect={handlePermSetSubTabChange}>
                            <!-- SUB-TAB: ASSIGNED USERS -->
                            <lightning-tab label="Assigned Users" value="users" icon-name="standard:user">
                                <div class="section-toolbar">
                                    <div class="toolbar-filters">
                                        <span class="slds-text-heading_small slds-m-right_medium">
                                            Users Assigned <span class="badge-count">{selectedPermSet.assignedUsers.length}</span>
                                        </span>
                                    </div>
                                    <div class="toolbar-actions">
                                        <lightning-button
                                            label="+ Assign Users"
                                            icon-name="utility:add"
                                            variant="brand"
                                            onclick={handlePromptAssignUsersToPs}
                                        ></lightning-button>
                                    </div>
                                </div>

                                <div class="styled-table-container">
                                    <table class="custom-data-table">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Username</th>
                                                <th>Email</th>
                                                <th>Profile</th>
                                                <th>Status</th>
                                                <th class="slds-text-align_right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template lwc:if={hasPermSetAssignedUsers}>
                                                <template for:each={selectedPermSet.assignedUsers} for:item="u">
                                                    <tr key={u.userId}>
                                                        <td><strong>{u.name}</strong></td>
                                                        <td><code>{u.username}</code></td>
                                                        <td>{u.email}</td>
                                                        <td>{u.profileName}</td>
                                                        <td>
                                                            <span class={u.statusClass}>
                                                                {u.statusBadge}
                                                            </span>
                                                        </td>
                                                        <td class="slds-text-align_right">
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Remove User Assignment"
                                                                variant="border-filled"
                                                                data-id={u.userId}
                                                                data-name={u.name}
                                                                onclick={handlePromptRemoveUserFromPs}
                                                            ></lightning-button-icon>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <tr>
                                                    <td colspan="6" class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                                        No users currently assigned to this permission set.
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-tab>

                            <!-- SUB-TAB: OBJECT PERMISSIONS -->
                            <lightning-tab label="Object Permissions" value="objects" icon-name="standard:entity">
                                <div class="styled-table-container">
                                    <table class="custom-data-table">
                                        <thead>
                                            <tr>
                                                <th>Object</th>
                                                <th>API Name</th>
                                                <th class="slds-text-align_center">Read</th>
                                                <th class="slds-text-align_center">Create</th>
                                                <th class="slds-text-align_center">Edit</th>
                                                <th class="slds-text-align_center">Delete</th>
                                                <th class="slds-text-align_center">View All</th>
                                                <th class="slds-text-align_center">Modify All</th>
                                                <th class="slds-text-align_right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template lwc:if={hasPermSetObjectPerms}>
                                                <template for:each={selectedPermSet.objectPermissions} for:item="op">
                                                    <tr key={op.sobjectType}>
                                                        <td><strong>{op.sobjectLabel}</strong></td>
                                                        <td><code>{op.sobjectType}</code></td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsRead}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsCreate}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsEdit}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsDelete}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsViewAllRecords}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={op.permissionsModifyAllRecords}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_right">
                                                            <template lwc:if={op.isEditable}>
                                                                <lightning-button
                                                                    label="Edit"
                                                                    size="small"
                                                                    variant="neutral"
                                                                    data-type={op.sobjectType}
                                                                    onclick={handleOpenEditObject}
                                                                ></lightning-button>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="badge-metadata">Metadata Managed</span>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <tr>
                                                    <td colspan="9" class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                                        No object permissions configured on this permission set.
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-tab>

                            <!-- SUB-TAB: FIELD PERMISSIONS -->
                            <lightning-tab label="Field Permissions" value="fields" icon-name="standard:custom_notification">
                                <div class="styled-table-container">
                                    <table class="custom-data-table">
                                        <thead>
                                            <tr>
                                                <th>Object</th>
                                                <th>Field</th>
                                                <th class="slds-text-align_center">Read Access</th>
                                                <th class="slds-text-align_center">Edit Access</th>
                                                <th class="slds-text-align_right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template lwc:if={hasPermSetFieldPerms}>
                                                <template for:each={selectedPermSet.fieldPermissions} for:item="fp">
                                                    <tr key={fp.field}>
                                                        <td><strong>{fp.sobjectType}</strong></td>
                                                        <td><code>{fp.field}</code></td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={fp.permissionsRead}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_center">
                                                            <template lwc:if={fp.permissionsEdit}><span class="perm-check-true">✓</span></template>
                                                            <template lwc:else><span class="perm-check-false">—</span></template>
                                                        </td>
                                                        <td class="slds-text-align_right">
                                                            <template lwc:if={fp.isEditable}>
                                                                <lightning-button
                                                                    label="Edit"
                                                                    size="small"
                                                                    variant="neutral"
                                                                    data-field={fp.field}
                                                                    onclick={handleOpenEditField}
                                                                ></lightning-button>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="badge-metadata">Metadata Managed</span>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <tr>
                                                    <td colspan="5" class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                                        No field-level security permissions explicitly configured on this permission set.
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-tab>
                        </lightning-tabset>
                    </template>

                    <template lwc:else>
                        <!-- PERMISSION SETS LIST VIEW -->
                        <div class="section-toolbar">
                            <div class="toolbar-filters">
                                <div class="search-input-box">
                                    <lightning-input
                                        type="search"
                                        label="Search Permission Sets"
                                        variant="label-hidden"
                                        placeholder="Search by Name or Label..."
                                        value={psSearchTerm}
                                        onchange={handlePsSearch}
                                    ></lightning-input>
                                </div>
                                <div class="filter-combo-box">
                                    <lightning-combobox
                                        label="Type Filter"
                                        variant="label-hidden"
                                        value={psTypeFilter}
                                        options={psTypeOptions}
                                        onchange={handlePsTypeFilterChange}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="toolbar-actions">
                                <span class="slds-text-body_small slds-text-color_weak">
                                    Showing {permSetsList.length} Permission Set(s)
                                </span>
                            </div>
                        </div>

                        <div class="styled-table-container">
                            <table class="custom-data-table">
                                <thead>
                                    <tr>
                                        <th>Label</th>
                                        <th>API Name</th>
                                        <th>Type</th>
                                        <th>License</th>
                                        <th>Assigned Users</th>
                                        <th>Description</th>
                                        <th class="slds-text-align_right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={permSetsList} for:item="ps">
                                        <tr key={ps.id}>
                                            <td><strong>{ps.label}</strong></td>
                                            <td><code>{ps.name}</code></td>
                                            <td><span class={ps.typeClass}>{ps.typeBadge}</span></td>
                                            <td>{ps.licenseName}</td>
                                            <td><span class="badge-count">{ps.userCount}</span></td>
                                            <td>{ps.description}</td>
                                            <td class="slds-text-align_right">
                                                <lightning-button
                                                    label="View & Manage"
                                                    icon-name="utility:preview"
                                                    variant="neutral"
                                                    data-id={ps.id}
                                                    onclick={handleViewPermSetDetail}
                                                ></lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </template>

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 3: PERMISSION SET GROUPS                               -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isGroupsTab}>
                    <template lwc:if={selectedGroup}>
                        <!-- GROUP DETAIL VIEW -->
                        <div class="detail-hero-banner">
                            <div class="hero-identity">
                                <div class="hero-avatar">
                                    <lightning-icon icon-name="standard:groups" size="medium" variant="inverse"></lightning-icon>
                                </div>
                                <div class="hero-title-block">
                                    <div class="hero-main-title">
                                        <span>{selectedGroup.groupSummary.masterLabel}</span>
                                        <span class="badge-active">{selectedGroup.groupSummary.status}</span>
                                    </div>
                                    <div class="hero-subtitle">
                                        <span><strong>Developer Name:</strong> <code>{selectedGroup.groupSummary.developerName}</code></span>

                                        <span><strong>Included Sets:</strong> {selectedGroup.groupSummary.componentCount}</span>

                                    <table class="custom-data-table">
                                        <thead>
                                            <tr>
                                                <th>Permission Set Label</th>
                                                <th>API Name</th>
                                                <th>Type</th>
                                                <th>License</th>
                                                <th>Description</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={selectedGroup.includedPermissionSets} for:item="ps">
                                                <tr key={ps.id}>
                                                    <td><strong>{ps.label}</strong></td>
                                                    <td><code>{ps.name}</code></td>
                                                    <td><span class={ps.typeClass}>{ps.typeBadge}</span></td>
                                                    <td>{ps.licenseName}</td>
                                                    <td>{ps.description}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-tab>

                            <lightning-tab label="Assigned Users" value="users" icon-name="standard:user">
                                <div class="section-toolbar">
                                    <div class="toolbar-filters">
                                        <span class="slds-text-heading_small slds-m-right_medium">
                                            Assigned Users <span class="badge-count">{selectedGroup.assignedUsers.length}</span>
                                        </span>
                                    </div>
                                    <div class="toolbar-actions">
                                        <lightning-button
                                            label="+ Assign Users to Group"
                                            icon-name="utility:add"
                                            variant="brand"
                                            onclick={handlePromptAssignUsersToGroup}

                                </div>

                                    <table class="custom-data-table">
                                        <thead>
                                            <tr>

                                                <th>Username</th>
                                                <th>Email</th>
                                                <th>Profile</th>
                                                <th>Status</th>
                                                <th class="slds-text-align_right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template lwc:if={hasGroupAssignedUsers}>

                                                        <td><code>{u.username}</code></td>
                                                        <td>{u.email}</td>
                                                        <td>{u.profileName}</td>
                                                        <td><span class={u.statusClass}>{u.statusBadge}</span></td>

                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Remove User"
                                                                variant="border-filled"
                                                                data-id={u.userId}
                                                                data-name={u.name}
                                                                onclick={handlePromptRemoveUserFromGroup}
                                                            ></lightning-button-icon>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <tr>
                                                    <td colspan="6" class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                                        No users currently assigned to this Permission Set Group.
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-tab>
                        </lightning-tabset>
                    </template>

                    <template lwc:else>

                        <div class="section-toolbar">
                            <div class="toolbar-filters">
                                <div class="search-input-box">
                                    <lightning-input
                                        type="search"
                                        label="Search Groups"
                                        variant="label-hidden"
                                        placeholder="Search by Label or Developer Name..."
                                        value={psgSearchTerm}
                                        onchange={handlePsgSearch}
                                    ></lightning-input>
                                </div>
                                <div class="filter-combo-box">
                                    <lightning-combobox
                                        label="Status Filter"
                                        variant="label-hidden"
                                        value={psgStatusFilter}
                                        options={psgStatusOptions}
                                        onchange={handlePsgStatusFilterChange}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="toolbar-actions">
                                <span class="slds-text-body_small slds-text-color_weak">
                                    Showing {groupsList.length} Group(s)
                                </span>
                            </div>
                        </div>

                        <div class="styled-table-container">
                            <table class="custom-data-table">
                                <thead>
                                    <tr>
                                        <th>Master Label</th>
                                        <th>Developer Name</th>
                                        <th>Status</th>
                                        <th>Included Sets</th>
                                        <th>Assigned Users</th>
                                        <th>Description</th>
                                        <th class="slds-text-align_right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={groupsList} for:item="grp">
                                        <tr key={grp.id}>
                                            <td><strong>{grp.masterLabel}</strong></td>
                                            <td><code>{grp.developerName}</code></td>
                                            <td><span class="badge-active">{grp.status}</span></td>
                                            <td><span class="badge-count">{grp.componentCount}</span></td>
                                            <td><span class="badge-count">{grp.assignedUserCount}</span></td>
                                            <td>{grp.description}</td>
                                            <td class="slds-text-align_right">
                                                <lightning-button
                                                    label="View & Manage"
                                                    icon-name="utility:preview"
                                                    variant="neutral"
                                                    data-id={grp.id}
                                                    onclick={handleViewGroupDetail}
                                                ></lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </template>

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 4: PROFILES                                            -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isProfilesTab}>
                    <template lwc:if={selectedProfile}>
                        <!-- PROFILE DETAIL VIEW -->
                        <div class="slds-page-header slds-page-header_record-home detail-header">
                            <div class="slds-page-header__row">
                                <div class="slds-page-header__col-title">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="standard:customers" size="medium" alternative-text="Profile"></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="slds-page-header__name">
                                                <div class="slds-page-header__name-title">
                                                    <h1>
                                                        <span>Profile</span>
                                                        <span class="slds-page-header__title slds-truncate" title={selectedProfile.profile.name}>{selectedProfile.profile.name}</span>
                                                    </h1>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-page-header__col-actions">
                                    <div class="slds-page-header__controls">
                                        <div class="slds-page-header__control">
                                            <lightning-button label="View in Setup" icon-name="utility:new_window" onclick={handleOpenProfileSetup}></lightning-button>
                                        </div>
                                        <div class="slds-page-header__control">

                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-page-header__row slds-page-header__row_gutters">
                                <div class="slds-page-header__col-details">
                                    <ul class="slds-page-header__detail-row detail-fields">
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">User License</div>
                                            <div class="slds-truncate">{selectedProfile.profile.userLicenseName}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">User Type</div>
                                            <div class="slds-truncate">{selectedProfile.profile.userType}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Users</div>
                                            <div class="slds-truncate">{selectedProfile.profile.userCount}</div>
                                        </li>
                                        <li class="slds-page-header__detail-block">
                                            <div class="slds-text-title slds-truncate">Created</div>
                                            <div class="slds-truncate">{selectedProfile.profile.createdDateFormatted}</div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <c-admin-access-editor
                            target-type="Profile"

                            onaccesschange={handleEditorAccessChange}
                        ></c-admin-access-editor>
                    </template>

                    <template lwc:else>
                        <!-- PROFILES LIST VIEW -->
                        <div class="section-toolbar">
                            <div class="toolbar-filters">
                                <div class="search-input-box">
                                    <lightning-input
                                        type="search"
                                        label="Search Profiles"
                                        variant="label-hidden"
                                        placeholder="Search Profiles by Name..."
                                        value={profileSearchTerm}
                                        onchange={handleProfileSearch}
                                    ></lightning-input>
                                </div>
                            </div>
                            <div class="toolbar-actions">
                                <span class="slds-text-body_small slds-text-color_weak">
                                    Showing {profilesList.length} Profile(s)
                                </span>
                            </div>
                        </div>

                        <div class="styled-table-container">
                            <table class="custom-data-table resp-list">
                                <thead>
                                    <tr>
                                        <th>Profile Name</th>
                                        <th>User License</th>
                                        <th>User Type</th>
                                        <th>Associated Users</th>
                                        <th>Description</th>
                                        <th class="slds-text-align_right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={profilesList} for:item="p">
                                        <tr key={p.id}>
                                            <td data-label="Profile Name"><strong>{p.name}</strong></td>
                                            <td data-label="User License">{p.userLicenseName}</td>
                                            <td data-label="User Type">{p.userType}</td>

                                                    label="Manage Access"
                                                    icon-name="utility:edit"
                                                    variant="brand"
                                                    data-id={p.id}

                                                ></lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </template>

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 5: OBJECT ACCESS                                       -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isObjectsTab}>
                    <div class="section-toolbar">
                        <div class="toolbar-filters">
                            <div class="filter-combo-box">
                                <lightning-combobox
                                    label="Target Type"
                                    variant="label-hidden"
                                    value={objTargetType}
                                    options={targetTypeOptions}
                                    onchange={handleObjTargetTypeChange}
                                ></lightning-combobox>
                            </div>
                            <div class="search-input-box">
                                <lightning-combobox
                                    label="Select Target"
                                    variant="label-hidden"
                                    value={objSelectedTargetId}
                                    options={objTargetOptions}
                                    placeholder="Select Target..."
                                    onchange={handleObjTargetChange}
                                ></lightning-combobox>
                            </div>
                            <div class="search-input-box">
                                <lightning-input
                                    type="search"
                                    label="Search Objects"
                                    variant="label-hidden"
                                    placeholder="Filter by Object API Name..."
                                    value={objSearchTerm}
                                    onchange={handleObjSearch}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>

                    <template lwc:if={isObjTargetCustom}>
                        <div class="info-alert-banner">
                            <lightning-icon icon-name="utility:edit" size="x-small" class="alert-icon"></lightning-icon>
                            <div>
                                <strong>Custom Permission Set Selected:</strong> You can directly update object-level CRUD and View All / Modify All permissions below. Changes are saved to Salesforce database.
                            </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="info-alert-banner warning">
                            <lightning-icon icon-name="utility:lock" size="x-small" class="alert-icon"></lightning-icon>
                            <div>
                                <strong>Profile Selected (View Only):</strong> Object permissions on Profiles are managed in Salesforce Setup metadata and cannot be updated via standard Apex DML.
                            </div>
                        </div>
                    </template>

                    <div class="styled-table-container">
                        <table class="custom-data-table">
                            <thead>
                                <tr>
                                    <th>Object Label</th>
                                    <th>API Name</th>
                                    <th>Type</th>
                                    <th class="slds-text-align_center">Read</th>
                                    <th class="slds-text-align_center">Create</th>
                                    <th class="slds-text-align_center">Edit</th>
                                    <th class="slds-text-align_center">Delete</th>
                                    <th class="slds-text-align_center">View All</th>
                                    <th class="slds-text-align_center">Modify All</th>
                                    <th class="slds-text-align_right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template lwc:if={hasObjPermItems}>
                                    <template for:each={objPermItems} for:item="op">
                                        <tr key={op.sobjectType}>
                                            <td><strong>{op.sobjectLabel}</strong></td>
                                            <td><code>{op.sobjectType}</code></td>
                                            <td><span class={op.typeClass}>{op.typeBadge}</span></td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsRead}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsCreate}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsEdit}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsDelete}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsViewAllRecords}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={op.permissionsModifyAllRecords}><span class="perm-check-true">✓</span></template>
                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_right">
                                                <template lwc:if={op.isEditable}>
                                                    <lightning-button
                                                        label="Edit Permissions"
                                                        icon-name="utility:edit"
                                                        variant="brand-outline"
                                                        data-type={op.sobjectType}
                                                        onclick={handleOpenEditObject}
                                                    ></lightning-button>
                                                </template>
                                                <template lwc:else>
                                                    <span class="badge-metadata">Metadata Managed</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <tr>
                                        <td colspan="10" class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                            No object permissions configured for this selection.
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <!-- ---------------------------------------------------------- -->
                <!-- TAB 6: FIELD-LEVEL SECURITY (FLS)                          -->
                <!-- ---------------------------------------------------------- -->
                <template lwc:if={isFieldsTab}>
                    <div class="section-toolbar">
                        <div class="toolbar-filters">
                            <div class="filter-combo-box">
                                <lightning-combobox
                                    label="Select Object"
                                    variant="label-hidden"
                                    value={flsSelectedObject}
                                    options={objectOptions}
                                    onchange={handleFlsObjectChange}
                                ></lightning-combobox>
                            </div>
                            <div class="filter-combo-box">
                                <lightning-combobox
                                    label="Target Type"
                                    variant="label-hidden"
                                    value={flsTargetType}
                                    options={targetTypeOptions}
                                    onchange={handleFlsTargetTypeChange}
                                ></lightning-combobox>
                            </div>
                            <div class="search-input-box">
                                <lightning-combobox
                                    label="Select Target"
                                    variant="label-hidden"
                                    value={flsSelectedTargetId}
                                    options={flsTargetOptions}
                                    onchange={handleFlsTargetChange}

                                    <th class="slds-text-align_center">Edit Access</th>
                                    <th class="slds-text-align_right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template lwc:if={hasFlsFieldItems}>
                                    <template for:each={flsFieldItems} for:item="fp">

                                            <td><strong>{fp.fieldLabel}</strong></td>
                                            <td><code>{fp.field}</code></td>
                                            <td><span class="slds-badge slds-theme_shade">{fp.dataType}</span></td>
                                            <td><span class={fp.typeClass}>{fp.typeBadge}</span></td>
                                            <td class="slds-text-align_center">

                                                <template lwc:else><span class="perm-check-false">—</span></template>
                                            </td>
                                            <td class="slds-text-align_center">
                                                <template lwc:if={fp.permissionsEdit}><span class="perm-check-true">✓</span></template>

                                                        variant="brand-outline"

                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <!-- ---------------------------------------------------------- -->

                                Showing {appsList.length} App(s)

                        </div>
                    </div>

                    <div class="styled-table-container">

                                <tr>
                                    <th>App Label</th>
                                    <th>Developer Name</th>
                                    <th>Type</th>
                                    <th>Visibility</th>

                                    <th class="slds-text-align_right">Setup</th>
                                </tr>

                            <tbody>
                                <template for:each={appsList} for:item="app">
                                    <tr key={app.id}>
                                        <td><strong>{app.label}</strong></td>
                                        <td><code>{app.developerName}</code></td>
                                        <td><span class="slds-badge slds-theme_shade">{app.type}</span></td>
                                        <td><span class={app.visibleClass}>{app.visibleLabel}</span></td>
                                        <td><span class={app.accessibleClass}>{app.accessibleLabel}</span></td>

        <!-- ============================================================== -->

            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="change-profile-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
